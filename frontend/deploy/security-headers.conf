# ATENÇÃO: no nginx, `add_header` NÃO é herdado por um bloco que define os
# seus próprios. Por isso estes cabeçalhos vivem num arquivo e são incluídos
# em TODO location que use add_header — senão a CSP é silenciosamente
# descartada justamente no documento principal, que é onde ela importa.
#
# `base-uri 'self'` e não 'none': com 'none' o navegador descarta o
# `<base href="/">` do index, e os assets relativos do Angular passam a
# resolver contra a rota atual — em /incidents/<id> o bundle é pedido como
# /incidents/main-*.js e a aplicação não inicializa. 'self' continua
# barrando o ataque real, que é um <base> injetado apontando para fora.
#
# O conteúdo desta aplicação inclui campos controlados por atacante
# (user_agent, linha de comando de processo, URL de alerta): a CSP é a segunda
# linha de defesa, depois da interpolação do Angular.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
