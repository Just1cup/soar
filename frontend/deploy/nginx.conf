# Configuração principal. Base alpine-slim (12,7 MB) em vez da variante
# "unprivileged" (54 MB): o que aquela fazia por nós está explícito aqui.
worker_processes auto;
# Sem diretiva `user`: o processo já sobe como nginx (uid 101), e a diretiva
# exigiria root para ser aplicada.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Tudo que o nginx escreve vai para tmpfs, para o rootfs poder ser read-only.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
