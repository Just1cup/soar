apiVersion: v1
kind: Service
metadata: { name: soar-api, namespace: soar }
spec:
  selector: { app: soar-api }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: soar-api, namespace: soar }
spec:
  replicas: 1
  selector: { matchLabels: { app: soar-api } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: soar-api } }
    spec:
      serviceAccountName: soar-api
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532,
                         seccompProfile: { type: RuntimeDefault } }
      # Deixa o endpoint sair do Service antes de o processo parar de aceitar:
      # sem isto, todo rollout gera um punhado de 502.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: soar-api:dev
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: soar-config }
            - secretRef:    { name: soar-secrets }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: "1",  memory: 256Mi }
          # Liveness NÃO consulta o banco nem provedor externo: se o Elastic
          # ou o VirusTotal caírem, o Kubernetes não deve reiniciar este pod.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop: { sleep: { seconds: 5 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
