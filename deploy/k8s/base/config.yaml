apiVersion: v1
kind: ConfigMap
metadata: { name: soar-config, namespace: soar }
data:
  SOAR_ENV: "production"
  SOAR_PROFILE: "edge"          # docs/soar/08 §5
  SOAR_LOG_LEVEL: "info"
  SOAR_HTTP_ADDR: "0.0.0.0:8080"
  SOAR_DB_MAX_CONNS: "10"
  NGINX_RESOLVER: "kube-dns.kube-system.svc.cluster.local"
  API_UPSTREAM: "http://soar-api.soar.svc.cluster.local:8080"
---
# Placeholder. O segredo real NUNCA vem daqui: use External Secrets, Vault ou
# `kubectl create secret` fora do repositório (docs/soar/03 §12).
apiVersion: v1
kind: Secret
metadata: { name: soar-secrets, namespace: soar }
type: Opaque
stringData:
  SOAR_DATABASE_URL: "postgres://soar:CHANGEME@soar-postgres:5432/soar?sslmode=disable"
  SOAR_CURSOR_SECRET: "CHANGEME"
  POSTGRES_PASSWORD: "CHANGEME"
