# Uma ServiceAccount por workload, sem token montado: nenhum destes processos
# fala com a API do Kubernetes. Um token montado por padrão é credencial de
# graça para quem comprometer o pod.
apiVersion: v1
kind: ServiceAccount
metadata: { name: soar-api, namespace: soar }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: soar-frontend, namespace: soar }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: soar-migrate, namespace: soar }
automountServiceAccountToken: false
